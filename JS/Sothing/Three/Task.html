<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4d;
            --text: #e7ecf3;
            --muted: #8b9cb3;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 1.5rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            text-align: center;
        }

        .stat span {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat small {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .card h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 0 0 0.75rem;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .form-row input,
        .form-row select {
            flex: 1 1 120px;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
        }

        .form-row button,
        .filters button,
        .search-row button {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .form-row button:hover,
        .filters button:hover,
        .search-row button:hover {
            filter: brightness(1.08);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .filters button {
            background: var(--border);
            color: var(--text);
        }

        .filters button.active {
            background: var(--accent);
            color: #fff;
        }

        .search-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .search-row input {
            flex: 1;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
        }

        #tasks {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            background: var(--bg);
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--muted);
        }

        .task-body {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-weight: 600;
        }

        .task-meta {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .priority-high {
            color: #f87171;
        }

        .priority-medium {
            color: #fbbf24;
        }

        .priority-low {
            color: var(--muted);
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .task-actions input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            cursor: pointer;
        }

        .task-actions button.delete {
            padding: 0.35rem 0.65rem;
            font-size: 0.8rem;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--danger);
            cursor: pointer;
            font-weight: 600;
        }

        .task-actions button.delete:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Todo List</h1>

        <section class="stats" id="stats" aria-live="polite">
            <div class="stat"><span id="stat-total">0</span><small>Total</small></div>
            <div class="stat"><span id="stat-completed">0</span><small>Completed</small></div>
            <div class="stat"><span id="stat-pending">0</span><small>Pending</small></div>
        </section>

        <section class="card">
            <h2>Add task</h2>
            <form class="form" id="task-form">
                <div class="form-row">
                    <input type="text" id="title" name="title" placeholder="Title" required>
                    <input type="text" id="category" name="category" placeholder="Category" required>
                    <select id="priority" name="priority" required>
                        <option value="">Priority</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                    <button type="submit" id="addTask">Add</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Filter &amp; search</h2>
            <div class="filters" role="group" aria-label="Filter by status">
                <button type="button" id="filter-all" class="active">All</button>
                <button type="button" id="filter-active">Active</button>
                <button type="button" id="filter-completed">Completed</button>
            </div>
            <div class="search-row">
                <input type="search" id="tasksearch" placeholder="Search by title or category…" autocomplete="off">
                <button type="button" id="search-btn">Search</button>
            </div>
        </section>

        <section class="display" aria-label="Tasks">
            <ul id="tasks"></ul>
            <p class="empty" id="empty-msg" hidden>No tasks yet. Add one above.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
