<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign up</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: linear-gradient(145deg, #e8e8ec 0%, #f5f5f7 50%, #ebebf0 100%);
        }

        .auth-wrap {
            width: 100%;
            max-width: 380px;
            padding: 1rem;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .message.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        .message.error.shake {
            animation: shake 0.45s ease;
        }

        .auth-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            background: #f0f0f2;
            padding: 4px;
        }

        .tabs button {
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }

        .tabs button:hover {
            color: #111;
        }

        .tabs button.active {
            background: #fff;
            color: #111;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .panel {
            display: none;
            padding: 1.5rem;
            animation: panelIn 0.35s ease;
        }

        .panel.active {
            display: block;
        }

        @keyframes panelIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel h1 {
            margin: 0 0 1.25rem;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .panel form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .panel input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        .panel input:focus {
            outline: none;
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        }

        .panel button[type="submit"] {
            margin-top: 0.35rem;
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            border: none;
            background: #111;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .panel button[type="submit"]:hover {
            background: #333;
        }

        .panel button[type="submit"]:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <div class="auth-wrap">
        <div id="message" class="message" role="status" aria-live="polite"></div>
        <div class="auth-card">
            <div class="tabs" role="tablist">
                <button type="button" id="tab-login" class="active" role="tab" aria-selected="true"
                    aria-controls="login-panel" data-panel="login">Login</button>
                <button type="button" id="tab-signup" role="tab" aria-selected="false" aria-controls="signup-panel"
                    data-panel="signup">Sign up</button>
            </div>
            <section id="login-panel" class="panel active" role="tabpanel" aria-labelledby="tab-login">
                <h1>Login</h1>
                <form id="login-form" class="login-form" novalidate>
                    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
                    <input type="password" name="password" placeholder="Password" autocomplete="current-password"
                        required>
                    <button type="submit">Login</button>
                </form>
            </section>
            <section id="signup-panel" class="panel" role="tabpanel" aria-labelledby="tab-signup" hidden>
                <h1>Sign up</h1>
                <form id="signup-form" class="signup-form" novalidate>
                    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
                    <input type="email" name="email" placeholder="Email" autocomplete="email" required>
                    <input type="password" name="password" placeholder="Password (min 6 characters)"
                        autocomplete="new-password" required>
                    <button type="submit">Create account</button>
                </form>
            </section>
        </div>
    </div>
    <script src="signup.js"></script>
</body>

</html>
